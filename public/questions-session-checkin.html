<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in de Presenca</title>
  <meta name="theme-color" content="#0086ff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png?v=2" type="image/png">
  <link rel="icon" href="../icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png?v=2">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="questions-board-body">
  <main class="questions-board-shell questions-checkin-shell">
    <section class="questions-board-hero" aria-label="Check-in de presenca">
      <div>
        <p class="profile-section-kicker">Check-in</p>
        <h1 id="session-checkin-title" class="questions-board-title">Registrar presenca</h1>
        <p id="session-checkin-copy" class="questions-board-copy">Leia o QR no palco e confirme seu check-in.</p>
      </div>

      <div class="questions-board-meta">
        <p id="session-checkin-status" class="form-message info-message">Validando QR...</p>
      </div>
    </section>

    <section class="questions-checkin-panel">
      <div class="questions-checkin-meta">
        <p class="questions-session-summary-label">Sessao</p>
        <p id="session-checkin-summary" class="questions-session-summary">Carregando dados da sessao...</p>
        <span id="session-checkin-points" class="questions-checkin-highlight">+5 pontos por presenca</span>
      </div>

      <div class="questions-checkin-actions">
        <button id="session-checkin-button" class="primary-button" type="button">Confirmar presenca</button>
        <a href="../perfil/" class="secondary-button">Voltar para perfil</a>
      </div>
    </section>
  </main>

  <script src="../js/runtime-config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/questions-session-checkin.js"></script>
</body>
</html>

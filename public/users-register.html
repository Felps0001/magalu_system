<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Users</title>
  <meta name="theme-color" content="#0086ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Posicionamento Magalu 2026">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png?v=2" type="image/png">
  <link rel="icon" href="../icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png?v=2">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="first-access-body">
  <main class="first-access-mobile-shell">
    <section class="first-access-top-panel" aria-label="Cadastro de users">
      <img class="first-access-top-image" src="../assets/img/layer-topo.png" alt="Cadastro de users Magalu">
      <div class="first-access-top-content">
        <img class="first-access-top-logo" src="../assets/img/magalu-logo-white.png" alt="Magalu">
        <div class="first-access-top-copy user-register-top-copy">
          <h1 class="first-access-top-title">Cadastro de Users</h1>
          <p class="first-access-top-subtitle user-register-top-subtitle">Preencha apenas os campos que fizerem sentido.</p>
        </div>
      </div>
    </section>

    <section class="first-access-mobile-panel user-register-panel">
      <p class="user-register-intro">Nenhum campo e obrigatorio. Se o id_magalu for informado, o sistema continua protegendo contra duplicidade.</p>

      <form id="users-register-form" class="first-access-mobile-form user-register-form">
        <label class="sr-only" for="users-register-nome">Nome</label>
        <input id="users-register-nome" name="nome" class="first-access-mobile-input" type="text" placeholder="Nome">

        <label class="sr-only" for="users-register-id-magalu">ID Magalu</label>
        <input id="users-register-id-magalu" name="id_magalu" class="first-access-mobile-input" type="text" placeholder="ID Magalu">

        <label class="sr-only" for="users-register-cpf">CPF</label>
        <input id="users-register-cpf" name="cpf" class="first-access-mobile-input" type="text" placeholder="CPF">

        <label class="sr-only" for="users-register-cargo">Cargo</label>
        <input id="users-register-cargo" name="cargo" class="first-access-mobile-input" type="text" placeholder="Cargo">

        <label class="sr-only" for="users-register-regional">Regional</label>
        <input id="users-register-regional" name="regional" class="first-access-mobile-input" type="text" placeholder="Regional">

        <label class="sr-only" for="users-register-filial">Filial</label>
        <input id="users-register-filial" name="filial" class="first-access-mobile-input" type="text" placeholder="Filial">

        <button id="users-register-submit" class="user-register-submit" type="submit">Cadastrar user</button>

        <p id="users-register-message" class="form-message user-register-message" aria-live="polite"></p>
        <pre id="users-register-result" class="user-register-result" hidden></pre>
      </form>
    </section>
  </main>

  <script src="../js/runtime-config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/users-register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR de Presenca</title>
  <meta name="theme-color" content="#0086ff">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png?v=2" type="image/png">
  <link rel="icon" href="../icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-192.png?v=2">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="questions-board-body questions-qrcode-screen-body">
  <main class="questions-qrcode-screen" aria-label="QR de presenca da sessao ativa">
    <p class="profile-section-kicker questions-qrcode-screen-kicker">Presenca</p>
    <h1 id="session-qrcode-title" class="questions-qrcode-screen-title">Carregando palco...</h1>
    <div id="session-qrcode-preview" class="questions-qrcode-screen-preview" aria-live="polite">
      <p id="session-qrcode-status" class="questions-session-summary">Carregando QR da sessao...</p>
    </div>
  </main>

  <script src="../js/runtime-config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/questions-config.js"></script>
  <script src="../js/questions-session-qrcode.js"></script>
</body>
</html>
